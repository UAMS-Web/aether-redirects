title: 'Tagged URL request'
tabs:
  main:
    display: Main
    sections:
      -
        display: Request
        instructions: 'A request for a tagged URL with no vanity URL. The marketing redirect utility creates these and its review queue approves them; nothing serves from this collection. Copy this blueprint into the host as `collections/tagged_url_requests/tagged_url_request`, and the collection file `tagged_url_requests_collection.yaml` as `content/collections/tagged_url_requests.yaml`.'
        fields:
          -
            handle: destination
            field:
              type: text
              display: Destination
              instructions: 'The URL the tag is added to.'
              validate:
                - required
              listable: true
          -
            handle: utm_campaign
            field:
              type: text
              display: utm_campaign
              width: 33
          -
            handle: utm_id
            field:
              type: text
              display: utm_id
              width: 33
          -
            handle: utm_marketing_tactic
            field:
              type: text
              display: utm_marketing_tactic
              width: 33
          -
            handle: suppress_utm
            field:
              type: toggle
              display: 'Leave the utm_ parameters off'
          -
            handle: creative_services
            field:
              type: toggle
              display: 'Involves Creative Services'
              width: 33
          -
            handle: job_number
            field:
              type: text
              display: 'Creative Services job number'
              width: 66
          -
            handle: requester
            field:
              type: text
              display: Requester
          -
            handle: notes
            field:
              type: textarea
              display: Notes
      -
        display: Choices
        instructions: 'The choices the request was made with, saved by the utility and read back when the request is approved: the ids of the options chosen, the text typed beside them, and the values of the request fields the site''s parameters read. `utm_campaign`, `utm_id` and `utm_marketing_tactic` above hold the values of a request saved before the request fields followed the parameters, and are still read for it. The issued URL, not these entries, is the record of what was issued.'
        fields:
          -
            handle: channel
            field:
              type: text
              display: Channel
              instructions: 'The id of the chosen channel option.'
              visibility: read_only
          -
            handle: steps
            field:
              type: array
              display: 'Step choices'
              instructions: 'The id of the option chosen at each cascade step, by step.'
              visibility: read_only
          -
            handle: lists
            field:
              type: array
              display: 'List choices'
              instructions: 'The id of the option chosen from each other lookup list, by list id.'
              visibility: read_only
          -
            handle: custom_values
            field:
              type: array
              display: 'Custom values'
              instructions: 'The text typed beside a step or list choice, by step or list id.'
              visibility: read_only
          -
            handle: request_fields
            field:
              type: array
              display: 'Request fields'
              instructions: 'The value of each request field a parameter reads, by handle.'
              visibility: read_only
      -
        display: Approval
        instructions: 'Fields the utility writes. The tagged URL is composed and stored when an approver approves the request, so a later change to a parameter or a lookup list does not change it.'
        fields:
          -
            handle: status
            field:
              type: select
              display: Status
              instructions: 'Set by the review queue. Read-only here, so the entry editor cannot approve a request without issuing its tagged URL.'
              options:
                pending: Pending
                approved: Approved
                rejected: Rejected
              visibility: read_only
              listable: true
              filterable: true
              width: 33
          -
            handle: tagged_url
            field:
              type: text
              display: 'Tagged URL'
              instructions: 'Issued when the request is approved.'
              visibility: read_only
              listable: true
          -
            handle: submitted_by
            field:
              type: text
              display: 'Submitted by'
              visibility: read_only
              width: 33
          -
            handle: reviewed_by
            field:
              type: text
              display: 'Reviewed by'
              visibility: read_only
              width: 33
          -
            handle: rejection_reason
            field:
              type: textarea
              display: 'Rejection reason'
              visibility: read_only
